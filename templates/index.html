<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Network Topology Mapper</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #f8fafc; 
            text-align: center; 
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 16px;
        }
        .input-box {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 220px;
        }
        .input-box:focus {
            border-color: #38bdf8;
        }
        #network-map {
            width: 100%;
            height: 520px;
            border: 1px solid #334155;
            border-radius: 12px;
            background-color: #1e293b;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #475569; }
        #status { margin-top: 10px; font-size: 14px; color: #94a3b8; }
        
        /* Modal Design */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .modal-content {
            background-color: #1e293b;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            text-align: left;
            color: #f8fafc;
        }
        .close-btn {
            color: #94a3b8;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover { color: #f8fafc; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
        th { background-color: #0284c7; }
    </style>
</head>
<body>
    <h2>Local Network Visualizer & Topology Mapper</h2>
    
    <div class="dashboard">
        <div class="card">Total Devices: <span id="device-count" style="color: #38bdf8; font-weight: bold;">0</span></div>
        <input type="text" id="subnetInput" class="input-box" placeholder="Auto or 192.168.1 / 10.0.0.1">
        <button id="scan-btn" class="btn" onclick="fetchNetworkData()">Scan Network</button>
    </div>
    
    <div id="status">Ready to scan. Tip: Double-click a device node for deep port scan (1-1024).</div>
    <div id="network-map"></div>

    <!-- Port Scan Modal -->
    <div id="port-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="color: #38bdf8; margin-top: 0;">Port Scan Audit</h3>
            <div id="modal-status">Scanning ports 1-1024...</div>
            <table id="ports-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Port</th>
                        <th>Service / Banner</th>
                    </tr>
                </thead>
                <tbody id="ports-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let network = null;
        let nodesDataSet = null;

        function fetchNetworkData() {
            const btn = document.getElementById('scan-btn');
            const status = document.getElementById('status');
            const counter = document.getElementById('device-count');
            const inputVal = document.getElementById('subnetInput').value.trim();
            
            btn.disabled = true;

            let apiUrl = '/api/network-data';
            if (inputVal) {
                apiUrl += `?subnet=${encodeURIComponent(inputVal)}`;
                status.innerText = `Scanning target network (${inputVal}) & detecting services...`;
            } else {
                status.innerText = "Scanning local network & detecting services...";
            }

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    counter.innerText = data.total_devices;
                    
                    const container = document.getElementById('network-map');
                    nodesDataSet = new vis.DataSet(data.nodes);
                    const graphData = {
                        nodes: nodesDataSet,
                        edges: new vis.DataSet(data.edges)
                    };
                    const options = {
                        nodes: { 
                            font: { color: '#f8fafc', size: 13 },
                            borderWidth: 2
                        },
                        edges: { color: '#475569', width: 2 },
                        physics: { barnesHut: { gravitationalConstant: -3500 } }
                    };
                    
                    if (network !== null) {
                        network.destroy();
                    }
                    network = new vis.Network(container, graphData, options);
                    
                    // Double Click Event to trigger Deep Port Scan
                    network.on("doubleClick", function (params) {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const clickedNode = nodesDataSet.get(nodeId);
                            if (clickedNode && clickedNode.ip) {
                                openPortModal(clickedNode.ip);
                            }
                        }
                    });

                    status.innerText = "Scan completed! Double-click any device for deep port auditing.";
                    btn.disabled = false;
                })
                .catch(err => {
                    console.error('Error:', err);
                    status.innerText = "Failed to fetch network data.";
                    btn.disabled = false;
                });
        }

        function openPortModal(ip) {
            const modal = document.getElementById('port-modal');
            const title = document.getElementById('modal-title');
            const modalStatus = document.getElementById('modal-status');
            const table = document.getElementById('ports-table');
            const list = document.getElementById('ports-list');

            title.innerText = `Multi-Port Audit: ${ip}`;
            modalStatus.innerText = "Auditing ports (1 - 1024) with 100 threads, please wait...";
            table.style.display = 'none';
            list.innerHTML = '';
            modal.style.display = 'block';

            fetch(`/api/scan-ports/${ip}`)
                .then(res => res.json())
                .then(data => {
                    if (data.open_ports.length === 0) {
                        modalStatus.innerText = "No open ports found in 1-1024 range.";
                    } else {
                        modalStatus.innerText = `Found ${data.open_ports.length} open port(s):`;
                        data.open_ports.forEach(p => {
                            const row = `<tr><td>${p.port}</td><td>${p.service}</td></tr>`;
                            list.innerHTML += row;
                        });
                        table.style.display = 'table';
                    }
                })
                .catch(err => {
                    modalStatus.innerText = "Error scanning ports.";
                });
        }

        function closeModal() {
            document.getElementById('port-modal').style.display = 'none';
        }

        window.onload = fetchNetworkData;
    </script>
</body>
</html>
