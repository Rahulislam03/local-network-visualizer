<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Network Topology Mapper</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #f8fafc; 
            text-align: center; 
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }
        .card {
            background-color: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 16px;
        }
        #network-map {
            width: 100%;
            height: 520px;
            border: 1px solid #334155;
            border-radius: 12px;
            background-color: #1e293b;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #475569; }
        #status { margin-top: 10px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <h2>Local Network Visualizer & Topology Mapper</h2>
    
    <div class="dashboard">
        <div class="card">Total Devices: <span id="device-count" style="color: #38bdf8; font-weight: bold;">0</span></div>
        <button id="scan-btn" class="btn" onclick="fetchNetworkData()">Refresh Scan</button>
    </div>
    
    <div id="status">Ready to scan.</div>
    <div id="network-map"></div>

    <script>
        let network = null;

        function fetchNetworkData() {
            const btn = document.getElementById('scan-btn');
            const status = document.getElementById('status');
            const counter = document.getElementById('device-count');
            
            btn.disabled = true;
            status.innerText = "Scanning devices and auditing open ports...";

            fetch('/api/network-data')
                .then(response => response.json())
                .then(data => {
                    counter.innerText = data.total_devices;
                    
                    const container = document.getElementById('network-map');
                    const graphData = {
                        nodes: new vis.DataSet(data.nodes),
                        edges: new vis.DataSet(data.edges)
                    };
                    const options = {
                        nodes: { 
                            font: { color: '#f8fafc', size: 13 },
                            borderWidth: 2
                        },
                        edges: { color: '#475569', width: 2 },
                        physics: { barnesHut: { gravitationalConstant: -3500 } }
                    };
                    network = new vis.Network(container, graphData, options);
                    
                    status.innerText = "Scan completed successfully!";
                    btn.disabled = false;
                })
                .catch(err => {
                    console.error('Error:', err);
                    status.innerText = "Failed to fetch network data.";
                    btn.disabled = false;
                });
        }

        window.onload = fetchNetworkData;
    </script>
</body>
</html>
